<!-- soc_core/templates/soc/sidebar.html -->
<aside class="sidebar d-flex flex-column justify-content-between">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
            <span class="badge bg-primary p-2">NIDS</span>
            <span class="fw-bold fs-5 text-light">SOC Console</span>
        </div>
        <nav class="nav flex-column">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Live Monitor & SOC
            </a>
            <a href="/sandbox/" class="nav-link {% if active_page == 'sandbox' %}active{% endif %}">
                <i class="bi bi-shield-shaded"></i> XDR Payload Sandbox
            </a>
            <a href="/reports/" class="nav-link {% if active_page == 'reports' %}active{% endif %}">
                <i class="bi bi-file-earmark-bar-graph"></i> Rapoarte & Metrică
            </a>
        </nav>
    </div>

    <!-- Zonă Comutator Model ML (Research vs Baseline) + Stare Platformă -->
    <div class="px-2 pt-3 border-top border-secondary">
        <div class="p-2 mb-3 rounded bg-dark border border-secondary">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <small class="text-secondary fw-bold" style="font-size: 0.7rem;">PROFIL NIDS ML</small>
                <span id="active-model-badge" class="badge bg-success" style="font-size: 0.65rem;">RESEARCH</span>
            </div>

            <select id="model-mode-selector" class="form-select form-select-sm bg-black text-light border-secondary mt-1" style="font-size: 0.78rem;" onchange="switchModelProfile(this.value)">
                <option value="research">🔬 Research (NSGA-II | 5 Feat)</option>
                <option value="baseline">📊 Baseline (Clasic | 18 Feat)</option>
            </select>

            <div class="mt-2 d-flex justify-content-between text-muted" style="font-size: 0.68rem;">
                <span>Latență:</span>
                <span class="text-info fw-bold" id="model-latency-val">~0.42 ms</span>
            </div>
        </div>

        <small class="text-secondary d-block">Stare Platformă:</small>
        <span class="badge bg-success mt-1">Sistem Activ</span>
    </div>
</aside>

<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('/api/switch-model/')
        .then(response => response.json())
        .then(data => {
            if (data.active_mode) {
                const selector = document.getElementById('model-mode-selector');
                const badge = document.getElementById('active-model-badge');
                const latency = document.getElementById('model-latency-val');

                if (selector) selector.value = data.active_mode;
                if (badge) {
                    badge.innerText = data.active_mode.toUpperCase();
                    badge.className = data.active_mode === 'research' ? 'badge bg-success' : 'badge bg-primary';
                }
                if (data.metrics && data.metrics.latency_ms && latency) {
                    latency.innerText = data.metrics.latency_ms + ' ms';
                }
            }
        })
        .catch(err => console.error("Eroare la încărcarea profilului modelului:", err));
});

function switchModelProfile(newMode) {
    fetch('/api/switch-model/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ mode: newMode })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            window.location.reload();
        } else {
            alert("Eroare: " + data.message);
        }
    })
    .catch(err => alert("Eroare conexiune API: " + err));
}
</script>
